<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GS Kigeme A school logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="topArc" d="M 32,150 A 118,118 0 0 1 268,150"/>
    <path id="bottomArc" d="M 24,150 A 126,126 0 0 0 276,150"/>
  </defs>

  <!-- outer white badge and dark green rim -->
  <circle cx="150" cy="150" r="146" fill="#ffffff"/>
  <circle cx="150" cy="150" r="140" fill="none" stroke="#0f4d26" stroke-width="5"/>

  <!-- inner green disc -->
  <circle cx="150" cy="150" r="104" fill="#1b7a3d"/>
  <circle cx="150" cy="150" r="98" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- curved lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0f4d26" letter-spacing="3" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">GS KIGEME A</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#0f4d26" letter-spacing="5" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">RWANDA</textPath>
  </text>

  <!-- dots separating the lettering -->
  <circle cx="26" cy="150" r="5" fill="#1b7a3d"/>
  <circle cx="274" cy="150" r="5" fill="#1b7a3d"/>

  <!-- rising sun -->
  <circle cx="150" cy="112" r="20" fill="#ffffff"/>
  <g transform="translate(150 112)" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-30" x2="0" y2="-42" transform="rotate(-90)"/>
    <line x1="0" y1="-30" x2="0" y2="-42" transform="rotate(-45)"/>
    <line x1="0" y1="-30" x2="0" y2="-42"/>
    <line x1="0" y1="-30" x2="0" y2="-42" transform="rotate(45)"/>
    <line x1="0" y1="-30" x2="0" y2="-42" transform="rotate(90)"/>
  </g>

  <!-- open book -->
  <path d="M150,204 Q118,188 80,194 L80,150 Q118,142 150,158 Z" fill="#ffffff"/>
  <path d="M150,204 Q182,188 220,194 L220,150 Q182,142 150,158 Z" fill="#ffffff"/>
  <line x1="150" y1="158" x2="150" y2="204" stroke="#1b7a3d" stroke-width="3"/>
  <g stroke="#1b7a3d" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M94,162 Q118,158 138,168" fill="none"/>
    <path d="M94,174 Q118,170 138,180" fill="none"/>
    <path d="M206,162 Q182,158 162,168" fill="none"/>
    <path d="M206,174 Q182,170 162,180" fill="none"/>
  </g>
</svg>
